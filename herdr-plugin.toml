id = "ikaye.kaye"
name = "KAYE Explorer"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Interactive folder browser and full-code +/- viewer for KAYE shadow-git VCS"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

[[actions]]
id = "open"
title = "Open KAYE panel"
contexts = ["workspace"]
command = ["target/release/herdr-kaye", "open"]

[[panes]]
id = "panel"
title = "KAYE"
placement = "split"
command = ["target/release/herdr-kaye", "panel"]
